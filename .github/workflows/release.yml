name: Release (Windows)

# Push a tag like v1.0.5 (after bumping "version" in package.json) -> builds the installer and
# publishes a GitHub Release with the setup .exe, its .sig and latest.json (used by the in-app updater).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install JS dependencies
        run: npm install

      - name: Build + publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Secrets -> Settings > Secrets and variables > Actions of the repo. Never commit these.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'INEX CLIENT ${{ github.ref_name }}'
          releaseBody: |
            ## INEX CLIENT ${{ github.ref_name }} 🎮

            ### ✨ Highlights & Features
            - 🎮 **Profile Isolation**: Independent `.minecraft` instances, isolated game directories, custom JVM flags, and flexible RAM controls.
            - ⚡ **Multi-Loader Support**: Full metadata resolution and installation for **Vanilla**, **Fabric**, **Quilt**, **Forge**, and **NeoForge**.
            - 📦 **Modrinth API v2 Integration**: In-app content browser to install Mods, Modpacks (`.mrpack`), Resource Packs, Shaders, and Data Packs in one click.
            - ☕ **Smart Java Runtime Management**: Automatic detection for Java 8, 17, 21, and 25 with version compatibility verification and portable JRE auto-bundling.
            - 👤 **Accounts & 3D Skin Studio**: Microsoft OAuth2 authentication + offline Local profiles with animated 3D character and waving cape previews.
            - 🎧 **Discord RPC & Live Console**: Live Discord Rich Presence with game status and real-time Minecraft output console.
            - 🚀 **Tauri v2 + Rust Architecture**: Ultra-fast startup, low RAM footprint, and smooth Windows 10/11 desktop experience.

            ### 📦 Installation
            Download the installer (`INEX.CLIENT_${{ github.ref_name }}_x64-setup.exe`) below and run the setup wizard.
          releaseDraft: false
          prerelease: false
