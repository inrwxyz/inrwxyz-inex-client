name: Release (Windows)

# Push a tag like v1.0.5 (after bumping "version" in package.json) -> builds the installer and
# publishes a GitHub Release with the setup .exe, its .sig and latest.json (used by the in-app updater).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install JS dependencies
        run: npm install

      - name: Build + publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Secrets -> Settings > Secrets and variables > Actions of the repo. Never commit these.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'INEX CLIENT ${{ github.ref_name }}'
          releaseBody: |
            ## INEX CLIENT ${{ github.ref_name }} 🎮

            ### ✨ Highlights & Features
            - 🎮 **Profile Isolation**: independent game directories per profile, custom JVM flags and flexible RAM controls.
            - ⚡ **Mod Loaders**: install and launch **Fabric**, **Forge** and **Vanilla** profiles.
            - 📦 **Modrinth Integration**: in-app browser to install Mods, Modpacks (`.mrpack`), Resource Packs, Shaders and Data Packs.
            - ☕ **Smart Java Management**: automatic detection of Java 8, 17, 21 and 25 with a portable runtime when none is installed.
            - 👤 **Accounts & Skin Studio**: Microsoft sign-in, offline accounts, skin slots and skin sync.
            - 🖥️ **Server Hosting**: create Vanilla, Paper, Purpur and Fabric servers with console, players, plugins/mods, file editor, Geyser (Bedrock) support and built-in public tunnels.
            - 🔑 **Server Access by Code**: let a friend manage one of your servers over direct P2P. No account and no server, just two copy-paste codes.
            - 🎧 **Discord RPC & Live Console**: Discord Rich Presence and a real-time Minecraft output console.
            - 🚀 **Tauri v2 + Rust**: fast startup, low RAM usage and signed automatic updates.

            ### 📦 Installation
            Download the installer (`INEX.CLIENT_${{ github.ref_name }}_x64-setup.exe`) below and run the setup wizard.
          releaseDraft: false
          prerelease: false
